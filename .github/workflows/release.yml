name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      baked_keys:
        description: 'Comma-separated vless:// keys to bake in (overrides BAKED_KEYS secret)'
        required: false
        default: ''

jobs:
  build-mac-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: actions/setup-go@v5
        with:
          go-version-file: xray-core/go.mod
          cache-dependency-path: xray-core/go.sum

      - name: Build xray (darwin/arm64)
        run: make xray-mac

      - name: Package DMG
        run: ./gradlew :composeApp:packageDmg -PbakedKeys="${{ github.event.inputs.baked_keys || secrets.BAKED_KEYS }}"

      - name: Rename
        run: mv composeApp/build/compose/binaries/main/dmg/Green-*.dmg "Green-${{ github.ref_name }}-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: "Green-${{ github.ref_name }}-arm64.dmg"
          path: "Green-${{ github.ref_name }}-arm64.dmg"


  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: actions/setup-go@v5
        with:
          go-version-file: xray-core/go.mod
          cache-dependency-path: xray-core/go.sum

      - name: Build xray (windows/amd64)
        shell: bash
        run: make xray-windows

      - name: Package MSI
        shell: bash
        run: ./gradlew :composeApp:packageMsi -PbakedKeys="${{ github.event.inputs.baked_keys || secrets.BAKED_KEYS }}"

      - name: Rename
        shell: bash
        run: mv composeApp/build/compose/binaries/main/msi/Green-*.msi "Green-${{ github.ref_name }}-windows.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: "Green-${{ github.ref_name }}-windows.msi"
          path: "Green-${{ github.ref_name }}-windows.msi"

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: actions/setup-go@v5
        with:
          go-version-file: xray-core/go.mod
          cache-dependency-path: xray-core/go.sum

      - name: Build xray (linux/amd64)
        run: make xray-linux

      - name: Package AppImage
        run: ./gradlew :composeApp:packageAppImage -PbakedKeys="${{ github.event.inputs.baked_keys || secrets.BAKED_KEYS }}"

      - name: Locate and rename AppImage
        run: |
          find composeApp/build/compose/binaries -name "*.AppImage" -o -name "*.appimage" | head -5
          src=$(find composeApp/build/compose/binaries -iname "*.appimage" | head -1)
          echo "Found: $src"
          mv "$src" "Green-${{ github.ref_name }}-linux.AppImage"

      - name: Bundle tarball from distributable
        run: |
          appdir=$(find composeApp/build/compose/binaries/main/app -maxdepth 1 -mindepth 1 -type d | head -1)
          echo "App dir: $appdir"
          tar -czf "Green-${{ github.ref_name }}-linux.tar.gz" -C "$(dirname "$appdir")" "$(basename "$appdir")"

      - uses: actions/upload-artifact@v4
        with:
          name: "Green-${{ github.ref_name }}-linux.AppImage"
          path: "Green-${{ github.ref_name }}-linux.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: "Green-${{ github.ref_name }}-linux.tar.gz"
          path: "Green-${{ github.ref_name }}-linux.tar.gz"

  release:
    needs: [build-mac-arm64, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
