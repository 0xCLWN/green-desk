name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      baked_keys:
        description: 'Comma-separated vless:// keys to bake in (overrides BAKED_KEYS secret)'
        required: false
        default: ''

jobs:
  build-mac-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-go@v5
        with:
          go-version-file: xray-core/go.mod
          cache-dependency-path: xray-core/go.sum

      - name: Build xray (darwin/arm64)
        run: make xray-mac

      - name: Package DMG
        run: ./gradlew :composeApp:packageDmg -PbakedKeys="${{ github.event.inputs.baked_keys || secrets.BAKED_KEYS }}"

      - name: Rename
        run: mv composeApp/build/compose/binaries/main/dmg/Green-*.dmg Green-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Green-arm64.dmg
          path: Green-arm64.dmg


  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-go@v5
        with:
          go-version-file: xray-core/go.mod
          cache-dependency-path: xray-core/go.sum

      - name: Build xray (windows/amd64)
        shell: bash
        run: make xray-windows

      - name: Package MSI
        shell: bash
        run: ./gradlew :composeApp:packageMsi -PbakedKeys="${{ github.event.inputs.baked_keys || secrets.BAKED_KEYS }}"

      - name: Rename
        shell: bash
        run: mv composeApp/build/compose/binaries/main/msi/Green-*.msi Green-windows.msi

      - uses: actions/upload-artifact@v4
        with:
          name: Green-windows.msi
          path: Green-windows.msi

  release:
    needs: [build-mac-arm64, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
