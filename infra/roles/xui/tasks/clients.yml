---
# Register regular clients on this node's inbound.
- name: Check existing clients
  uri:
    url: "https://localhost:{{ xui_panel_port }}/panel/api/clients/get/{{ item.name }}"
    method: GET
    headers:
      Authorization: "Bearer {{ vault_nodes[inventory_hostname].api_token }}"
    status_code: [200, 404]
    validate_certs: false
  register: _client_check
  loop: "{{ clients }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [clients]

- name: Add missing clients
  uri:
    url: "https://localhost:{{ xui_panel_port }}/panel/api/clients/add"
    method: POST
    headers:
      Authorization: "Bearer {{ vault_nodes[inventory_hostname].api_token }}"
    body_format: json
    body:
      client:
        email: "{{ item.item.name }}"
        id: "{{ vault_clients[item.item.name].uuid }}"
        subId: "{{ vault_clients[item.item.name].sub_id }}"
        flow: xtls-rprx-vision
        enable: true
        totalGB: 0
        expiryTime: 0
      inboundIds:
        - "{{ xui_inbound_id }}"
    status_code: 200
    validate_certs: false
  loop: "{{ _client_check.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.status == 404
  tags: [clients]

# Register relay clients (e.g. A's account on B, so A can connect to B's inbound).
- name: Compute relay clients that should exist on this node
  set_fact:
    _relay_clients_for_node: >-
      {%- set result = [] -%}
      {%- for key, val in vault_relay_clients.items() -%}
        {%- set parts = key.split('_to_') -%}
        {%- if parts | length == 2 and parts[1] == inventory_hostname -%}
          {%- set _ = result.append({'key': key, 'uuid': val.uuid, 'email': 'relay-' ~ key | lower | replace('_', '-')}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ result }}
  tags: [clients]

- name: Check existing relay clients
  uri:
    url: "https://localhost:{{ xui_panel_port }}/panel/api/clients/get/{{ item.email }}"
    method: GET
    headers:
      Authorization: "Bearer {{ vault_nodes[inventory_hostname].api_token }}"
    status_code: [200, 404]
    validate_certs: false
  register: _relay_check
  loop: "{{ _relay_clients_for_node }}"
  loop_control:
    label: "{{ item.email }}"
  tags: [clients]

- name: Add missing relay clients
  uri:
    url: "https://localhost:{{ xui_panel_port }}/panel/api/clients/add"
    method: POST
    headers:
      Authorization: "Bearer {{ vault_nodes[inventory_hostname].api_token }}"
    body_format: json
    body:
      client:
        email: "{{ item.item.email }}"
        id: "{{ item.item.uuid }}"
        flow: xtls-rprx-vision
        enable: true
        totalGB: 0
        expiryTime: 0
      inboundIds:
        - "{{ xui_inbound_id }}"
    status_code: 200
    validate_certs: false
  loop: "{{ _relay_check.results }}"
  loop_control:
    label: "{{ item.item.email }}"
  when: item.status == 404
  tags: [clients]

# Toggle enable/disable without deleting.
- name: Sync client enable state
  uri:
    url: "https://localhost:{{ xui_panel_port }}/panel/api/clients/update/{{ item.name }}"
    method: POST
    headers:
      Authorization: "Bearer {{ vault_nodes[inventory_hostname].api_token }}"
    body_format: json
    body:
      client:
        email: "{{ item.name }}"
        enable: "{{ item.enable | default(true) }}"
      inboundIds:
        - "{{ xui_inbound_id }}"
    status_code: 200
    validate_certs: false
  loop: "{{ clients }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.enable is defined
  tags: [clients]
