---
# Build list of (upstream_inventory_hostname, downstream_inventory_hostname) pairs where this node is the upstream.
- name: Compute relay legs for this node
  set_fact:
    _relay_legs: >-
      {{
        paths
        | selectattr('hops', 'defined')
        | map(attribute='hops')
        | map('zip', paths | selectattr('hops', 'defined') | map(attribute='hops') | map('list') | map('rest'))
        | flatten(levels=0)
        | list
      }}
  tags: [topology]

# Simpler approach: iterate paths, collect legs where this node is the sender.
- name: Collect outbound legs where this node is upstream
  set_fact:
    _my_legs: >-
      {%- set legs = [] -%}
      {%- for path in paths -%}
        {%- for i in range(path.hops | length - 1) -%}
          {%- if path.hops[i] == inventory_hostname -%}
            {%- set downstream = path.hops[i + 1] -%}
            {%- set leg_key = inventory_hostname ~ '_to_' ~ downstream -%}
            {%- set downstream_host = hostvars.values()
                | selectattr('inventory_hostname', 'defined')
                | selectattr('inventory_hostname', 'equalto', downstream)
                | first -%}
            {%- if legs | selectattr('key', 'equalto', leg_key) | list | length == 0 -%}
              {%- set _ = legs.append({
                'key': leg_key,
                'upstream': inventory_hostname,
                'downstream': downstream,
                'downstream_ip': downstream_host.ansible_host,
                'downstream_port': downstream_host.inbound.port,
                'downstream_pub_key': vault_nodes[downstream].reality_public_key,
                'downstream_short_id': vault_nodes[downstream].reality_short_ids[0],
                'downstream_sni': downstream_host.inbound.reality_server_names[0],
                'relay_uuid': vault_relay_clients[leg_key].uuid,
                'outbound_tag': 'relay-out-' ~ downstream
              }) -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ legs }}
  tags: [topology]

- name: Build relay outbounds JSON
  set_fact:
    _relay_outbounds: >-
      {%- set outbounds = [] -%}
      {%- for leg in _my_legs -%}
        {%- set _ = outbounds.append({
          'tag': leg.outbound_tag,
          'protocol': 'vless',
          'settings': {
            'vnext': [{
              'address': leg.downstream_ip,
              'port': leg.downstream_port | int,
              'users': [{
                'id': leg.relay_uuid,
                'flow': 'xtls-rprx-vision',
                'encryption': 'none'
              }]
            }]
          },
          'streamSettings': {
            'network': 'tcp',
            'security': 'reality',
            'realitySettings': {
              'publicKey': leg.downstream_pub_key,
              'shortId': leg.downstream_short_id,
              'serverName': leg.downstream_sni,
              'fingerprint': 'firefox',
              'spiderX': '/'
            }
          }
        }) -%}
      {%- endfor -%}
      {{ outbounds | to_json }}
  tags: [topology]

- name: Build routing rules JSON (inbound tag → relay outbound)
  set_fact:
    _relay_routing_rules: >-
      {%- set rules = [] -%}
      {%- for leg in _my_legs -%}
        {%- set _ = rules.append({
          'type': 'field',
          'inboundTag': [inbound.tag],
          'outboundTag': leg.outbound_tag
        }) -%}
      {%- endfor -%}
      {{ rules | to_json }}
  tags: [topology]

- name: Get current Xray config template
  uri:
    url: "https://localhost:{{ xui_panel_port }}/panel/api/xray/config"
    method: GET
    headers:
      Authorization: "Bearer {{ vault_nodes[inventory_hostname].api_token }}"
    status_code: 200
    validate_certs: false
  register: _xray_config
  when: _my_legs | length > 0
  tags: [topology]

- name: Merge relay outbounds and routing rules into Xray template
  uri:
    url: "https://localhost:{{ xui_panel_port }}/panel/api/xray/config"
    method: POST
    headers:
      Authorization: "Bearer {{ vault_nodes[inventory_hostname].api_token }}"
    body_format: json
    body: >-
      {{
        _xray_config.json.obj | combine({
          'outbounds': ((_xray_config.json.obj.outbounds | default([]))
            | rejectattr('tag', 'match', '^relay-out-')
            | list) + (_relay_outbounds | from_json),
          'routing': (_xray_config.json.obj.routing | default({})) | combine({
            'rules': ((_xray_config.json.obj.routing.rules | default([]))
              | rejectattr('outboundTag', 'match', '^relay-out-')
              | list) + (_relay_routing_rules | from_json)
          }, recursive=True)
        }, recursive=True)
      }}
    status_code: 200
    validate_certs: false
  when: _my_legs | length > 0
  notify: restart xui
  tags: [topology]

- name: Clear relay config if this node has no relay legs
  block:
    - name: Get current Xray config template (for cleanup)
      uri:
        url: "https://localhost:{{ xui_panel_port }}/panel/api/xray/config"
        method: GET
        headers:
          Authorization: "Bearer {{ vault_nodes[inventory_hostname].api_token }}"
        status_code: 200
    validate_certs: false
      register: _xray_config_clean

    - name: Remove any stale relay outbounds/rules
      uri:
        url: "https://localhost:{{ xui_panel_port }}/panel/api/xray/config"
        method: POST
        headers:
          Authorization: "Bearer {{ vault_nodes[inventory_hostname].api_token }}"
        body_format: json
        body: >-
          {{
            _xray_config_clean.json.obj | combine({
              'outbounds': (_xray_config_clean.json.obj.outbounds | default([]))
                | rejectattr('tag', 'match', '^relay-out-')
                | list,
              'routing': (_xray_config_clean.json.obj.routing | default({})) | combine({
                'rules': (_xray_config_clean.json.obj.routing.rules | default([]))
                  | rejectattr('outboundTag', 'match', '^relay-out-')
                  | list
              }, recursive=True)
            }, recursive=True)
          }}
        status_code: 200
    validate_certs: false
      when: >-
        ((_xray_config_clean.json.obj.outbounds | default([])
          | selectattr('tag', 'match', '^relay-out-') | list | length) > 0)
        or
        ((_xray_config_clean.json.obj.routing.rules | default([])
          | selectattr('outboundTag', 'match', '^relay-out-') | list | length) > 0)
      notify: restart xui
  when: _my_legs | length == 0
  tags: [topology]
