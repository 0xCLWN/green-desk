---
# Install or update x-ui bare-metal via the upstream install.sh.
# Non-interactive mode: all config is driven by environment variables.
# The script is idempotent — re-running updates the binary without touching
# existing credentials or certificates.
- name: Install or update x-ui (bare metal)
  script:
    cmd: "{{ playbook_dir }}/../server/install.sh"
    executable: /bin/bash
  environment:
    XUI_NONINTERACTIVE: "1"
    XUI_USERNAME: "{{ vault_xui_admin_username }}"
    XUI_PASSWORD: "{{ vault_nodes[inventory_hostname].admin_password }}"
    XUI_PANEL_PORT: "{{ xui_panel_port }}"
    XUI_SSL_MODE: "ip"
    XUI_ACME_HTTP_PORT: "80"
    XUI_WEB_BASE_PATH: "/"
    XUI_SERVER_IP: "{{ ansible_host }}"
  tags: [bootstrap, deploy]
