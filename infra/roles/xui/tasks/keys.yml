---
# Generate subscription URLs locally for each client — one URL per node per client.
# Runs on localhost — does not SSH to nodes.
- name: Generate subscription URLs
  run_once: true
  delegate_to: localhost
  block:
    - name: Ensure local keys/ directory exists
      file:
        path: "{{ playbook_dir }}/keys"
        state: directory
        mode: "0700"

    - name: Build subscription URL list per client
      set_fact:
        _client_subs: >-
          {%- set output = {} -%}
          {%- for client in clients -%}
            {%- set subs = [] -%}
            {%- for hostname, host in hostvars.items() | selectattr('1.ansible_host', 'defined') | list -%}
              {%- set scheme = 'https' if xui_sub_https else 'http' -%}
              {%- set sub_id = vault_clients[client.name].sub_id -%}
              {%- set url = scheme ~ '://' ~ host.ansible_host ~ ':' ~ xui_sub_port ~ xui_sub_path ~ '/' ~ sub_id -%}
              {%- set _ = subs.append({'node': hostname, 'url': url}) -%}
            {%- endfor -%}
            {%- set _ = output.update({client.name: subs}) -%}
          {%- endfor -%}
          {{ output }}

    - name: Write subscription file per client
      copy:
        dest: "{{ playbook_dir }}/keys/{{ item.key }}.txt"
        content: |
          # Subscription URLs for {{ item.key }}
          # Generated {{ ansible_date_time.iso8601 }}
          # Import each URL into your client app (Shadowrocket, v2rayN, etc.)
          # URLs auto-refresh when server config changes — no need to re-import.

          {% for entry in item.value | sort(attribute='node') %}
          # Node {{ entry.node }}
          {{ entry.url }}

          {% endfor %}
        mode: "0600"
      loop: "{{ _client_subs | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Print subscription URLs
      debug:
        msg: |
          Subscription URLs for {{ item.key }}:
          {% for entry in item.value | sort(attribute='node') %}
            Node {{ entry.node }}: {{ entry.url }}
          {% endfor %}
      loop: "{{ _client_subs | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
  tags: [keys]
